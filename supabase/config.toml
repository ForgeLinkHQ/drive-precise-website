project_id = "drive-precise"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://www.driveprecise.co.uk"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# There is no public sign-up on this site. Customers never need an account —
# a quote request is anonymous by design — so the only accounts that exist are
# Drive Precise staff, created deliberately.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[analytics]
enabled = false
