name: CI

# Every branch, not just main and open pull requests.
#
# A commit pushed to a branch whose pull request has already merged matched
# neither trigger, so it ran nothing and told nobody. Four branches across this
# platform sat that way for up to five days, one of them carrying a security
# fix. The concurrency rule below means the extra cost is one run per push
# rather than one per commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A later push on the same branch supersedes an earlier one — no reason to keep
# burning minutes on a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build has to come before the typecheck, not after. The TanStack
      # Router plugin generates src/routeTree.gen.ts during the build, and every
      # route file imports its types from it — so on a fresh checkout
      # `tsc --noEmit` has nothing to resolve against and fails on all of them.
      - name: Build
        run: npm run build
        env:
          # Placeholders. The build must not need real credentials: the
          # catalogue, the builder and every page render without Supabase, and
          # only submitting an enquiry needs it at runtime.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true

  # Catches the class of mistake unit tests cannot: a page that renders in a
  # test but throws in a real browser, a route that 404s, a nav link pointing at
  # nothing. Runs against the actual production build.
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Smoke test every route
        run: node scripts/smoke.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          retention-days: 7
          if-no-files-found: ignore
