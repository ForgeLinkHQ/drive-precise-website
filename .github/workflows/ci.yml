name: CI

# Every branch, not just main and open pull requests.
#
# A commit pushed to a branch whose pull request has already merged matched
# neither trigger, so it ran nothing and told nobody. Four branches across this
# platform sat that way for up to five days, one of them carrying a security
# fix. The concurrency rule below means the extra cost is one run per push
# rather than one per commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A later push on the same branch supersedes an earlier one — no reason to keep
# burning minutes on a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The build comes before the tests and the typecheck, and both orderings
      # are load-bearing. The TanStack Router plugin generates
      # src/routeTree.gen.ts during the build and every route file imports its
      # types from it, so on a fresh checkout `tsc --noEmit` has nothing to
      # resolve against. And `security-headers.test.ts` reads the generated
      # `.vercel/output/config.json` to prove the headers in vercel.json are
      # actually served — a test that could only skip in CI would be theatre.
      - name: Build
        run: npm run build
        env:
          # Placeholders. The build must not need real credentials: the
          # catalogue, the builder and every page render without Supabase, and
          # only submitting an enquiry needs it at runtime.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true

  # Two edge functions, and until this job existed neither was linted, formatted
  # or checked by anything. `deno check` would be better still, but it has to
  # resolve the https imports, and a job that fails when esm.sh is slow is a
  # job people learn to ignore.
  edge-functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint edge functions
        working-directory: supabase/functions
        run: deno lint

      - name: Check formatting
        working-directory: supabase/functions
        run: deno fmt --check

  # The other half of the test suite. Several of this site's rules live only in
  # SQL — the promotion substantiation gate is a WHERE clause, the enquiry
  # status rules are RAISE statements, and §60 is a column list on a definer
  # function — and none of that is checked by reading the migration text.
  #
  # This applies every migration to a real PostgreSQL in order, then runs the
  # assertions in supabase/tests against it. The bootstrap installs pgcrypto
  # into `extensions` the way Supabase does, which is how it caught a preview
  # function that had never once been able to run in production.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # No password at all, rather than a throwaway one. The container is
          # ephemeral and reachable only from this job, but a credential-shaped
          # line in a repository is a credential-shaped line, and secret
          # scanning is right to flag those rather than try to judge which ones
          # matter. This is also what the local harness does (`initdb -A
          # trust`), so the two agree.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Verify the migrations and the rules they carry
        run: bash scripts/verify-sql.sh
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres

  # Catches the class of mistake unit tests cannot: a page that renders in a
  # test but throws in a real browser, a route that 404s, a nav link pointing at
  # nothing. Runs against the actual production build, with the database
  # unplugged in the browser so the run measures the site and not the runner's
  # DNS.
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Smoke test every route
        run: node scripts/smoke.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          retention-days: 7
          if-no-files-found: ignore
